name: CI/CD Pipeline

on:
  push:
    branches: [ "feature/sub-site-pipeline" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps
          pip install requests

      - name: Run Pytest
        run: pytest -s --tracing=retain-on-failure || true

      - name: Verify 1080p Stream Size and Cancel
        run: |
          cat << 'EOF' > test_1080p_size.py
          import subprocess
          import json
          import requests
          import re
          import sys

          # 1. Execute your stream grabber script
          target_url = "https://www.fullhdporn.net/super-squirt-cake-destroyer-gets-anal-surprise-ny-ny-lew-brazzers_v1/"
          print(f"Running get_stream.py on: {target_url}")
          
          process = subprocess.run(
              ["python", "get_stream.py", target_url], 
              text=True, 
              capture_output=True
          )
          
          # 2. Extract PROBE_DATA JSON from the console output
          probe_match = re.search(r'PROBE_DATA:({.*})', process.stdout)
          if not probe_match:
              print("Failed to find PROBE_DATA. Script output:\n", process.stdout)
              sys.exit(1)
          
          probe_data = json.loads(probe_match.group(1))
          base_stream = probe_data.get("base_stream")
          
          # 3. Force the 360p link to 1080p
          stream_1080 = re.sub(r'-\d{3,4}\.mp4', '-1080.mp4', base_stream)
          
          headers = {
              "Referer": probe_data.get("referer", ""),
              "Cookie": probe_data.get("cookies", "")
          }
          
          print(f"Locked 1080p Stream URL: {stream_1080}")
          print("Connecting to fetch file headers...")
          
          # 4. Connect with stream=True to get size, then immediately close connection
          with requests.get(stream_1080, headers=headers, stream=True) as response:
              response.raise_for_status()
              size_bytes = int(response.headers.get("Content-Length", 0))
              size_gb = size_bytes / (1024 * 1024 * 1024)
          
              print(f"Success! Stream active.")
              print(f"Detected 1080p File Size: {size_gb:.2f} GB")
          
              # Fail the workflow if the size is too small (meaning 1080p failed and it fell back to 360p)
              if size_gb < 0.8:
                  print("Error: File size is too small. The 1080p stream upgrade failed.")
                  sys.exit(1)
          
              print("Size verified. Cancelling download to save CI bandwidth.")
          EOF
          
          python test_1080p_size.py

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 30