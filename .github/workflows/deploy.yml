name: CI/CD Pipeline

on:
  push:
    branches: [ "feature/sub-site-pipeline" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps

      - name: Run Pytest
        run: pytest -s --tracing=retain-on-failure || true

      - name: Execute Test Download (1080p)
        run: |
          echo "1080p" | python get_stream.py "https://example.com/test-video-url"

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 30