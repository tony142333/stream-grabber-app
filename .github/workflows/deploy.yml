name: CI/CD Pipeline

on:
  push:
    branches: [ "feature/sub-site-pipeline" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies & FFmpeg
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt requests
          python -m playwright install --with-deps
          # Install ffmpeg to probe video resolution
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run Pytest
        run: pytest -s --tracing=retain-on-failure || true

      - name: Verify 1080p Stream Size and Resolution
        run: |
          cat << 'EOF' > test_1080p_size.py
          import subprocess
          import json
          import requests
          import re
          import sys

          # 1. Execute your stream grabber script
          target_url = "https://www.fullhdporn.net/super-squirt-cake-destroyer-gets-anal-surprise-ny-ny-lew-brazzers_v1/"
          print(f"Running get_stream.py on: {target_url}")
          
          process = subprocess.run(
              ["python", "get_stream.py", target_url], 
              text=True, 
              capture_output=True
          )
          
          # 2. Extract PROBE_DATA JSON from the console output
          probe_match = re.search(r'PROBE_DATA:({.*})', process.stdout)
          if not probe_match:
              print("Failed to find PROBE_DATA. Script output:\n", process.stdout)
              sys.exit(1)
          
          probe_data = json.loads(probe_match.group(1))
          base_stream = probe_data.get("base_stream")
          
          # 3. Force the 360p link to 1080p
          stream_1080 = re.sub(r'-\d{3,4}\.mp4', '-1080.mp4', base_stream)
          
          referer = probe_data.get("referer", "")
          cookies = probe_data.get("cookies", "")
          
          headers_dict = {
              "Referer": referer,
              "Cookie": cookies
          }
          
          print(f"Locked 1080p Stream URL: {stream_1080}")
          
          # 4. Connect with stream=True to get size, then close connection
          print("\n--- CHECKING FILE SIZE ---")
          try:
              with requests.get(stream_1080, headers=headers_dict, stream=True) as response:
                  response.raise_for_status()
                  size_bytes = int(response.headers.get("Content-Length", 0))
                  size_gb = size_bytes / (1024 * 1024 * 1024)
                  print(f"Success! Stream active.")
                  print(f"Detected 1080p File Size: {size_gb:.2f} GB")
          except Exception as e:
              print(f"Warning: Could not fetch file size. {e}")

          # 5. Use ffprobe to check the exact pixel resolution of the remote file
          print("\n--- CHECKING PIXEL RESOLUTION ---")
          # FFmpeg requires headers separated by \r\n
          ffmpeg_headers = f"Referer: {referer}\r\nCookie: {cookies}\r\n"
          
          ffprobe_cmd = [
              "ffprobe",
              "-v", "error",
              "-headers", ffmpeg_headers,
              "-select_streams", "v:0",
              "-show_entries", "stream=width,height",
              "-of", "csv=s=x:p=0",
              stream_1080
          ]
          
          probe_proc = subprocess.run(ffprobe_cmd, text=True, capture_output=True)
          
          if probe_proc.returncode == 0:
              resolution = probe_proc.stdout.strip()
              print(f"Verified Video Resolution: {resolution}")
          else:
              print(f"Warning: ffprobe failed to read stream resolution. Error:\n{probe_proc.stderr}")
          
          EOF
          
          python test_1080p_size.py

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 30