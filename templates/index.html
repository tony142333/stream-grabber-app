<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Grabber Console</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2338bdf8'%3E%3Cpolygon points='13 2 3 14 12 14 11 22 21 10 12 10 13 2'%3E%3C/polygon%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="app-container">
    <aside class="sidebar">
        <div class="brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
            </svg>
            <span>Stream Grabber</span>
        </div>
        <nav class="nav-links">
            <a href="javascript:void(0)" class="nav-item active" onclick="switchView('active', this)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                Active Tasks
                <span class="badge" id="activeBadge">0</span>
            </a>
            <a href="javascript:void(0)" class="nav-item" onclick="switchView('completed', this)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                Downloads
                <span class="badge" id="completedBadge">0</span>
            </a>
            <a href="javascript:void(0)" class="nav-item" onclick="switchView('configs', this)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                Site Rules
                <span class="badge" id="configsBadge">0</span>
            </a>
            <a href="javascript:void(0)" class="nav-item" onclick="switchView('terminal', this)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
                Live Terminal
            </a>
        </nav>

        <div class="storage-info">
            <div class="storage-header">
                <span>Storage Pool</span>
                <span id="diskFreeText">-- GB Free</span>
            </div>
            <div class="storage-bar">
                <div class="storage-fill" id="diskFill" style="width: 0%;"></div>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <h2 id="viewTitle">Active Downloads</h2>
            <div class="header-actions" style="display: flex; gap: 8px; align-items: center;">
                <button id="btnClearFinished" onclick="clearTasksByStatus('COMPLETED')" style="background: transparent; color: #94a3b8; border: 1px solid #334155; padding: 7px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; display: none;">Clear Finished</button>
                <button id="btnClearStopped" onclick="clearTasksByStatus('STOPPED', 'FAILED')" style="background: transparent; color: #f87171; border: 1px solid #334155; padding: 7px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; display: none;">Clear Stopped</button>
                <button class="btn-primary" onclick="toggleInputCard()">+ New URL(s)</button>
            </div>
        </header>

        <div class="input-card" id="urlInputCard" style="display: none;">
            <textarea id="targetUrls" placeholder="Paste streaming page URLs (one per line)..." rows="4"></textarea>
            <div class="input-card-actions">
                <button class="btn-secondary" onclick="toggleInputCard()">Cancel</button>
                <button class="btn-primary" onclick="submitBatch()">Start Sniffing</button>
            </div>
        </div>

        <div class="view-panel active" id="panel-active">
            <div class="active-list" id="activeList">
                <div id="noActiveMsg" class="empty-msg">No downloads currently active. Click "+ New URL(s)" to start.</div>
            </div>
        </div>

        <div class="view-panel" id="panel-completed">
            <div class="table-container">
                <table class="files-table">
                    <thead>
                    <tr>
                        <th>File Name</th>
                        <th>Size</th>
                        <th>Finished Date</th>
                        <th>Preview</th>
                    </tr>
                    </thead>
                    <tbody id="filesTableBody"></tbody>
                </table>
            </div>
        </div>

        <div class="view-panel" id="panel-configs"></div>

        <div class="view-panel" id="panel-terminal">
            <div class="terminal-box" id="terminalLogs"></div>
        </div>
    </main>
</div>

<div id="previewModal" class="preview-modal" onclick="closePreviewModal(event)">
    <div class="preview-box" onclick="event.stopPropagation()">
        <div class="preview-box-header">
            <h3 id="previewTitle" style="font-size: 0.95rem; color: #fff;">Stream Preview (Tunneled via EC2)</h3>
            <button onclick="closePreviewModal()" style="background: transparent; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer;">✕</button>
        </div>
        <video id="previewPlayer" controls autoplay></video>
    </div>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
